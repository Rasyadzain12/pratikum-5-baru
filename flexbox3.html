<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum 5 - Implementasi Layout FlexBox 3 (Gambar 7)</title>
    <link rel="stylesheet" href="css/flexbox3.css">
    <link rel="stylesheet" href="css/back-button.css">
</head>
<body>
    <div class="title-section">
        <h2>Implementasi Layout FlexBox (3)</h2>
        <p>Representative Flex Layout Example - Penataan Foto dengan Flexbox</p>
    </div>

    <!-- Container Galeri Sesuai Gambar 7 (Susunan 3 - 2 - 3) -->
    <div class="gallery-container">
        <!-- Baris 1: 3 Foto -->
        <div class="flex-row">
            <div class="photo-box">
                <img src="img/burung1.png" alt="Burung 1">
                <div class="caption">Burung 1</div>
            </div>
            <div class="photo-box">
                <img src="img/burung2.png" alt="Burung 2">
                <div class="caption">Burung 2</div>
            </div>
            <div class="photo-box">
                <img src="img/burung3.png" alt="Burung 3">
                <div class="caption">Burung 3</div>
            </div>
        </div>

        <!-- Baris 2: 2 Foto (Lebih Lebar) -->
        <div class="flex-row">
            <div class="photo-box">
                <img src="img/burung4.png" alt="Burung 4">
                <div class="caption">Burung 4</div>
            </div>
            <div class="photo-box">
                <img src="img/burung5.png" alt="Burung 5">
                <div class="caption">Burung 5</div>
            </div>
        </div>

        <!-- Baris 3: 3 Foto -->
        <div class="flex-row">
            <div class="photo-box">
                <img src="img/burung6.png" alt="Burung 6">
                <div class="caption">Burung 6</div>
            </div>
            <div class="photo-box">
                <img src="img/burung1.png" alt="Burung 1">
                <div class="caption">Burung 1 (Alternatif)</div>
            </div>
            <div class="photo-box">
                <img src="img/burung2.png" alt="Burung 2">
                <div class="caption">Burung 2 (Alternatif)</div>
            </div>
        </div>
    </div>

    <!-- Tombol Kembali ke Index -->
    <a href="index.html" class="btn-kembali">&#8592; Kembali ke Index</a>
</body>
</html>
